# Bitcoin Inheritance, self-hosted.
#
# This builds the image from THIS repository. It does not pull a published
# image, because we publish none, and upstream's ghcr.io/eljojo/rememory
# carries none of the Bitcoin Butlers work: bundles made by it still name
# every guardian in every README.
#
#   docker compose up --build

services:
  inheritance:
    build: .
    ports:
      # 127.0.0.1 on purpose. Put a reverse proxy with TLS in front of it
      # before you expose this to a network.
      - "127.0.0.1:8080:8080"
    volumes:
      - inheritance-data:/data
    restart: unless-stopped
    # environment:
    #   INHERITANCE_MAX_MANIFEST_SIZE: 200MB

volumes:
  inheritance-data:
